<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>FlowDesk</title>
  <style>
    body {
      width: 250px;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 12px;
      background: #f7fafc;
      color: #1a202c;
    }
    h2 {
      font-size: 14px;
      margin: 0 0 10px 0;
      color: #6b46c1;
      text-align: center;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 8px;
      margin-bottom: 6px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      color: #4a5568;
      text-align: left;
      transition: background 0.15s;
    }
    .btn:hover {
      background: #edf2f7;
    }
    .btn.danger {
      color: #e53e3e;
      border-color: #feb2b2;
    }
    .btn.danger:hover {
      background: #fff5f5;
    }
    #status-operador {
      font-size: 11px;
      color: #718096;
      margin-bottom: 10px;
      text-align: center;
      padding-bottom: 8px;
      border-bottom: 1px solid #e2e8f0;
    }
  </style>
</head>
<body>
  <h2>⚙️ FlowDesk Menu</h2>
  <div id="status-operador">Carregando operador...</div>
  
  <div style="margin-bottom: 10px;">
      <label style="font-size: 11px; font-weight: 600; color: #4a5568; display: flex; align-items: center; justify-content: space-between; cursor: pointer;">
          Modo Escuro (Dark Mode)
          <input type="checkbox" id="chk-tema">
      </label>
  </div>
  
  <div style="margin-bottom: 10px;">
      <label style="font-size: 11px; font-weight: 600; color: #4a5568; display: block; margin-bottom: 4px;">Tamanho da Fonte</label>
      <select id="sel-fonte" style="width: 100%; padding: 6px; border: 1px solid #e2e8f0; border-radius: 4px; font-size: 12px; outline: none; font-family: inherit;">
          <option value="12px">Pequena</option>
          <option value="13px">Média (Padrão)</option>
          <option value="14px">Grande</option>
          <option value="16px">Extra Grande</option>
      </select>
  </div>

  <div style="margin-bottom: 10px;">
      <label style="font-size: 11px; font-weight: 600; color: #4a5568; display: block; margin-bottom: 4px;">Escala dos Painéis</label>
      <select id="sel-painel" style="width: 100%; padding: 6px; border: 1px solid #e2e8f0; border-radius: 4px; font-size: 12px; outline: none; font-family: inherit;">
          <option value="0.85">Pequeno</option>
          <option value="1.0">Médio (Padrão)</option>
          <option value="1.15">Grande</option>
      </select>
  </div>

  <div style="margin-top:8px; border-top:1px solid #e2e8f0; padding-top:8px;">
      <button class="btn" id="btn-settings">⚙ Configurações Avançadas</button>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
